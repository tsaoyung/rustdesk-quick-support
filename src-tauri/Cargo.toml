[package]
name = "rustdesk-client"
# 版本号唯一源是 `tauri.conf.json` 的 `version`（bundle 文件名、macOS
# CFBundleShortVersionString、界面显示都看它）。这里必须与之保持一致 ——
# CI 的 "Verify version consistency" 步骤会比对两处，不一致直接失败。
version = "0.1.1"
description = "RustDesk QuickSupport - Tauri Edition"
authors = ["rustdesk"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }
protobuf-codegen = { version = "3.7" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
dirs-next = "2.0"
rand = "0.8"
hex = "0.4.3"
sha2 = "0.10"
anyhow = "1"
bytes = "1"
protobuf = { version = "3.7", features = ["with-bytes"] }
sodiumoxide = "0.2"
# local IPv4 discovery, for the direct-IP address readout in the UI
local-ip-address = "0.6"
# screen capture + encode
xcap = "0.4"
image = "0.25"
openh264 = "0.7"
# input injection (vendored rustdesk enigo fork)
enigo = { path = "../libs/enigo" }
uuid = { version = "1", features = ["v4"] }
whoami = "1.5"
# file transfer compression (mirrors hbb_common compress.rs)
zstd = "0.13"
filetime = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
